backend rome_shared_fanex_remotingref_api_core_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template shared_fanex_remotingref_api_core_SIT_ 1 shared_fanex_remotingref_api_core_SIT:5000 check resolvers docker init-addr none


