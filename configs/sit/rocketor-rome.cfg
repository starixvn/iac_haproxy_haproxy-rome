
backend rome_alpha_content_administration_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template alpha_content_administration_SIT_ 2 alpha_content_administration_SIT:1337 check resolvers docker init-addr none

