frontend rome_alpha_assets_AWS_2_fe
    bind *:821
    option forwardfor
    option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend default_backend_nodes

#### I1
backend rome_alpha_assets_AWS_be
    option http-server-close
    option httpchk HEAD /bundles/common/hc.css
    http-check expect status 200
    server-template alpha_assets_AWS_ 2 alpha_assets_AWS:8080 check inter 12s fall 5 rise 5 resolvers docker init-addr none
