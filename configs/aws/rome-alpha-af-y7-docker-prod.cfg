#### I7 
frontend rome_i7_mb_AWS_fe
    bind *:8071
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i7_reports_AWS_be if { path_beg /site-reports/ }
    use_backend rome_alpha_i7_betlists_AWS_be if { path_beg /site-betlists/ }
    default_backend rome_i7_mb_AWS_be

frontend rome_i7_mb2_AWS_fe
    bind *:8075
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i7_reports_AWS_be if { path_beg /site-reports/ }
    use_backend rome_alpha_i7_betlists_AWS_be if { path_beg /site-betlists/ }
    default_backend rome_i7_mb2_AWS_be

# Report
backend rome_alpha_i7_reports_AWS_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/site-reports/,/)]
    server-template alpha_reports_AWS_2_ 4 alpha_reports_AWS_2:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

# Betlist
backend rome_alpha_i7_betlists_AWS_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/site-betlists/,/)]
    server-template alpha_betlists_AWS_2_ 2 alpha_betlists_AWS_2:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

