

backend rome_alpha_beforelogin_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server-template alpha_beforelogin_UAT_ 1 alpha_beforelogin_UAT:80 check resolvers docker init-addr none

