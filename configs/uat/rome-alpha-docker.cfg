frontend rome_alpha_i1_reports_UAT_be
    bind *:7403
    bind *:7404
    bind *:7405
    bind *:7406
    bind *:7407
    bind *:7408
    bind *:7409
    bind *:7410
    bind *:7411
    bind *:7412
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    use_backend %[path,map_beg(/etc/haproxy/maps/rome-alpha-i1.map)]
default_backend default_backend_nodes

frontend rome_alpha_i7_reports_UAT_be
    bind *:7423
    bind *:7424
    bind *:7425
    bind *:7426
    bind *:7427
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    use_backend %[path,map_beg(/etc/haproxy/maps/rome-alpha-i7.map)]
default_backend default_backend_nodes

backend rome_alpha_i1_reports_UAT_be
    balance roundrobin
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/reports/,/)]
    server-template alpha_i1_reports_UAT_ 2 alpha_reports_UAT:80 check inter 10s fall 5 rise 5 resolvers docker init-addr none

