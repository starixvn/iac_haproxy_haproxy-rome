#### I1 BE
backend rome_alpha_i1_reports_UAT_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/site-reports/,/)]
    server-template alpha_reports_UAT_ 2 alpha_reports_UAT:80 check inter 10s fall 5 rise 5 resolvers docker init-addr none

