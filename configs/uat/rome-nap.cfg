backend rome_nap_u3_UAT_be 
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_u3_UAT_ 1 nap_u3_UAT:5000 check resolvers docker init-addr none

backend rome_intaccounting_UAT_be
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server-template rome_intaccounting_UAT_nodes1_ 1 10.2.190.88:7400 check
    server-template rome_intaccounting_UAT_nodes2_ 1 10.2.190.89:7400 check backup
