backend rome_dsc_setting_api_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template rome_dsc_setting_api_nodes1_ 1 10.18.200.103:7200 check
    server-template rome_dsc_setting_api_nodes2_ 1 10.18.200.104:7200 check

