backend be_static
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_static" #if { path_beg /whoami }

backend rome_alpha_reports_LOCAL_be
    balance roundrobin
    option forwardfor
    timeout server 10m
    option http-server-close
#    option httpchk HEAD /whoami.aspx
#    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/reports/,/)]
    #server-template alpha_reports_LOCAL_ 4 alpha_reports_LOCAL:80 check inter 10s fall 5 rise 5 resolvers docker init-addr none
    server-template alpha_reports_LOCAL_ 4 alpha_reports_LOCAL:80 inter 10s fall 5 rise 5 resolvers docker init-addr none

backend rome_alpha_api_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template alpha_api_LOCAL_ 1 alpha_api_LOCAL:5000 check resolvers docker init-addr none

backend rome_alpha_before_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /Whoami.aspx
    http-check expect status 302
    cookie serverid insert
    server-template alpha_before_LOCAL_ 2 alpha_before_LOCAL:80 check resolvers docker init-addr none
