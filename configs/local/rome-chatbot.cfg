backend rome_chatbot_api_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.103_7431 10.18.200.103:7431 check
    server 10.18.200.104_7431 10.18.200.104:7431 check

backend rome_telegrambot_api_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template telegrambot_api_LOCAL_ 1 telegrambot_api_LOCAL:5000 check resolvers docker init-addr none

frontend rome_telegrambot_receiver_LOCAL_fe
    bind *:6341 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    use_backend rome_telegrambot_receiver_LOCAL_be

backend rome_telegrambot_receiver_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template telegrambot_receiver_LOCAL_ 1 telegrambot_receiver_LOCAL:5000 check resolvers docker init-addr none
