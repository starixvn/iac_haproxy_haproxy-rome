backend rome_nap_u3_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_u3_LOCAL_ 2 nap_u3_LOCAL:5000 check resolvers docker init-addr none

backend rome_nap_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7400 10.18.200.202:7400 check
    server 10.18.200.209_7400 10.18.200.209:7400 check

