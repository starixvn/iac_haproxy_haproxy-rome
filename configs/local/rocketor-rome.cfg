

backend rome_alpha_api_gateways_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    server-template alpha_api_gateways_LOCAL_ 1 alpha_api_gateways_LOCAL:5000 check resolvers docker init-addr none

