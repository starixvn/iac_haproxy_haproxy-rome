backend rome_alpha_betlists_LOCAL_2_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/site-betlists[/]?,/)]
    server-template alpha_betlists_LOCAL_2_ 1 alpha_betlists_LOCAL_2:80 check resolvers docker init-addr none
