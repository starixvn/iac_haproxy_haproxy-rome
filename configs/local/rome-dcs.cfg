backend rome_dcs_setting_api_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.103_7200 10.18.200.103:7200 check
    server 10.18.200.104_7200 10.18.200.104:7200 check

