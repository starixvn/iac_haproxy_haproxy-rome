backend rome_i1_staging_internal_ALPHAKLDR_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_703 10.2.27.111:703 check
    server 10.2.27.112_703 10.2.27.112:703 check

