## Report i1
backend rome_alpha_i1_staginginternalreports_ALPHAKLDR_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_staginginternalreports_ALPHAKLDR_ 2 alpha_staginginternalreports_ALPHAKLDR:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

