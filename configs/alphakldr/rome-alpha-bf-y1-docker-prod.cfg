#### I1 FE
frontend rome_alpha_i1_bf_ALPHAKLDR_fe
    bind *:858
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_internalreports_bf_ALPHAKLDR_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_internalbetlists_bf_ALPHAKLDR_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_alpha_i1_bf_ALPHAKLDR_be

#I7 BE
backend rome_alpha_i1_internal_bf_ALPHAKLDR_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_8081 10.2.27.111:8081 check
    server 10.2.27.112_8081 10.2.27.112:8081 check

backend rome_alpha_i1_bf_ALPHAKLDR_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_601 10.2.27.111:601 check
    server 10.2.27.112_601 10.2.27.112:601 check

## Report i1
backend rome_alpha_i1_internalreports_bf_ALPHAKLDR_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_internalreports_ALPHAKLDR_ 2 alpha_internalreports_ALPHAKLDR:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

## Betlist i1
backend rome_alpha_i1_internalbetlists_bf_ALPHAKLDR_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_internalbetlists_ALPHAKLDR_ 2 alpha_internalbetlists_ALPHAKLDR:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
