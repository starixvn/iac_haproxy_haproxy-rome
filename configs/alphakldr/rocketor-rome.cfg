

backend rome_fanex_customer_api_ALPHAKLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    server-template fanex_customer_api_ALPHAKLDR_ 1 fanex_customer_api_ALPHAKLDR:5000 check resolvers docker init-addr none

backend rome_fanex_customer_cdn_ALPHAKLDR_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/stdcsv1[/]?,/,i)]
    server-template fanex_customer_cdn_ALPHAKLDR_ 1 fanex_customer_cdn_ALPHAKLDR:8080 check resolvers docker init-addr none

