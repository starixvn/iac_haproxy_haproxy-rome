## mbc-mb
backend rome_alpha_mbc_mb_ALPHAKLDR_be
    balance leastconn
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server 10.143.8.68_8071 10.143.8.68:8071 check inter 12s fall 5 rise 5
    server 10.143.8.69_8071 10.143.8.69:8071 check inter 12s fall 5 rise 5
    server 10.143.8.70_8071 10.143.8.70:8071 check inter 12s fall 5 rise 5

## Report
backend rome_alpha_mbc_mb_reports_ALPHAKLDR_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_reports_ALPHAKLDR_ 1 alpha_reports_ALPHAKLDR:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

