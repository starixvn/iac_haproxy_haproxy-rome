#### I1
frontend rome_alpha_beforelogin_ALPHAKLDR_fe
    bind *:802
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_staginglogin_site_ALPHAKLDR_be if { hdr(host) -i staging-y1.gatonic.com }
    #use_backend rome_alpha_login_site_ALPHAKLDR_be if { hdr(host) -i www.borinote.com www.consonate.com www.riki88.com }
    default_backend rome_alpha_login_site_ALPHAKLDR_be

backend rome_alpha_login_site_ALPHAKLDR_be
    option http-server-close
    option httpchk GET /liveness
    http-check expect status 200
    server-template alpha_login_site_ALPHAKLDR_ 4 alpha_login_site_ALPHAKLDR:5000 check inter 12s fall 5 rise 5 resolvers docker init-addr none

backend rome_alpha_staginglogin_site_ALPHAKLDR_be
    option http-server-close
    option httpchk GET /liveness
    http-check expect status 200
    server-template alpha_staginglogin_site_ALPHAKLDR_ 2 alpha_staginglogin_site_ALPHAKLDR:5000 check inter 12s fall 5 rise 5 resolvers docker init-addr none
