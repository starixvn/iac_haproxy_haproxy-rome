backend rome_intaccounting_ALPHAKLDR_be
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    #server-template rome_intaccounting_ALPHAKLDR_nodes1_ 1 10.2.27.119:7400 check resolvers docker init-addr none
    #server-template rome_intaccounting_ALPHAKLDR_nodes2_ 1 10.2.27.120:7400 check resolvers docker init-addr none
    server rome_intaccounting_ALPHAKLDR_nodes1 10.2.27.119:7400 check
    server rome_intaccounting_ALPHAKLDR_nodes2 10.2.27.120:7400 check

