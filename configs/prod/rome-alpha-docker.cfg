#### I1 FE
frontend rome_i1_mb_PROD_fe
    bind *:8072
    #option dontlog-normal
    option forwardfor
    use_backend rome_alpha_i1_reports_PROD_be if { path_beg /site-reports/ }
    default_backend rome_i1_mb_PROD_be

