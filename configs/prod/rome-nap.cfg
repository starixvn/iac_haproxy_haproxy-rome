backend rome_intaccounting_PROD_nodes
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    #server-template rome_intaccounting_PROD_nodes1_ 1 10.2.27.119:7400 check resolvers docker init-addr none
    #server-template rome_intaccounting_PROD_nodes2_ 1 10.2.27.120:7400 check resolvers docker init-addr none
    server rome_intaccounting_PROD_nodes1 10.2.27.119:7400 check
    server rome_intaccounting_PROD_nodes2 10.2.27.120:7400 check

backend rome_nap_u3_PROD_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_u3_PROD_ 1 nap_u3_PROD:5000 check resolvers docker init-addr none