backend rome_fanex_um_PROD_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template fanex_um_PROD_ 1 fanex_um_PROD:5000 check resolvers docker init-addr none

#### Customer CDN
backend rome_fanex_customer_staging_cdn_PROD_be
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template fanex_customer_staging_cdn_PROD_ 2 fanex_customer_staging_cdn_PROD:8080 check inter 12s fall 5 rise 5 resolvers docker init-addr none

backend rome_fanex_customer_cdn_PROD_be
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template fanex_customer_cdn_PROD_ 2 fanex_customer_cdn_PROD:8080 check inter 12s fall 5 rise 5 resolvers docker init-addr none
