

backend rome_telegrambot_portalapis_PROD_path_be
    option forwardfor
    cookie serverid insert
    option http-keep-alive
    option httpchk GET /
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/fps[/]?,/)]
    server-template telegrambot_portalapis_PROD_ 1 telegrambot_portalapis_PROD:5000 check resolvers docker init-addr none

backend rome_shared_fanex_remotingref_api_core_PROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template shared_fanex_remotingref_api_core_PROD_ 1 shared_fanex_remotingref_api_core_PROD:5000 check resolvers docker init-addr none
