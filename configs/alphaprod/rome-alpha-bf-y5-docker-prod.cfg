#### I5 FE
frontend rome_alpha_i5_bf_ALPHAPROD_fe
    bind *:861
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_internalreports_bf_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_internalbetlists_bf_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/ex5.726872.com.map)] if { hdr(host) -i ex5.726872.com ex5.focapts.com }
    default_backend rome_alpha_i5_internal_bf_ALPHAPROD_be

#I5 BE
backend rome_alpha_i5_internal_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_8086 10.2.27.117:8086 check
    server 10.2.27.123_8086 10.2.27.123:8086 check
