#### I1
frontend rome_alpha_internalreports_globalip_fe
    bind *:8002
    mode http
    option dontlog-normal
    option forwardfor
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes

frontend rome_alpha_internalreports_officeip_fe
    bind *:8088
    option dontlog-normal
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #compression algo gzip
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    http-request use-service prometheus-exporter if { path /metrics }
    monitor-uri	/checkstatus
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes

#### I1
backend rome_alpha_internalreports_ALPHAPROD_be
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server-template alpha_internalreports_ALPHAPROD_ 2 alpha_internalreports_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

