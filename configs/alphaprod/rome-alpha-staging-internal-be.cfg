backend rome_i1_staging_internal_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_703 10.2.27.117:703 check
    server 10.2.27.123_703 10.2.27.123:703 check

