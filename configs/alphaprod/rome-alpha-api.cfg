### Alpha API
frontend rome_alpha_api_globalip_fe
    bind *:8003
    mode http
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-api-file678-com.map)] if { hdr(host) -i api.file678.com api.pilot88.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-api-ultra88-com.map)] if { hdr(host) -i api.ultra88.com api.zuranic.com api.halo888.com api.idag88.com api.tara88ag.com api.tp88ag.com api.bth688.com api.bth788.com api.bt1789.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend empty_backend_nodes

### telegram_webapp
backend rome_alpha_telegram_webapp_ALPHAPROD_be
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template telegrambot_web_app_ALPHAPROD_ 2 telegrambot_web_app_ALPHAPROD:5000 check inter 12s fall 5 rise 5 resolvers docker init-addr none

#### I1
backend rome_alpha_api_gateways_ALPHAPROD_be
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/alps/v1[/]?,/)]
    server-template alpha_api_gateways_ALPHAPROD_ 2 alpha_api_gateways_ALPHAPROD:5000 check inter 12s fall 5 rise 5 resolvers docker init-addr none

