
backend rome_fanex_customer_api_ALPHAPROD_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    server-template fanex_customer_api_ALPHAPROD_ 2 fanex_customer_api_ALPHAPROD:5000 check resolvers docker init-addr none

backend rome_alpha_ext_api_gateways_ALPHAPROD_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/helios/v1[/]?,/)]
