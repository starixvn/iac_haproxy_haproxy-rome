#### I1 BE
backend rome_alpha_i1_reports_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/site-reports/,/)]
    server-template alpha_reports_ALPHAPROD_ 4 alpha_reports_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

