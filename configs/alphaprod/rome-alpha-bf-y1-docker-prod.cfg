#### I1 FE
frontend rome_alpha_i1_bf_ALPHAPROD_fe
    bind *:858
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_internalreports_bf_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_internalbetlists_bf_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/ex1.726872.com.map)] if { hdr(host) -i ex1.726872.com ex1.focapts.com }
    use_backend rome_alphaplus_mbc_login_ALPHAPROD_be if { hdr(host) -i www.mu88ag.com }
    default_backend rome_alpha_i1_bf_ALPHAPROD_be

#I7 BE
backend rome_alpha_i1_internal_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_8081 10.2.27.117:8081 check
    server 10.2.27.123_8081 10.2.27.123:8081 check

backend rome_alpha_i1_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_601 10.2.27.117:601 check
    server 10.2.27.123_601 10.2.27.123:601 check

## Report i1
backend rome_alpha_i1_internalreports_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_internalreports_ALPHAPROD_ 2 alpha_internalreports_ALPHAPROD:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

## Betlist i1
backend rome_alpha_i1_internalbetlists_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_internalbetlists_ALPHAPROD_ 2 alpha_internalbetlists_ALPHAPROD:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
