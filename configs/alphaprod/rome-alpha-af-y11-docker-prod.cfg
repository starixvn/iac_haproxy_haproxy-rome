#### I11
frontend rome_i11_mb_ALPHAPROD_fe
    bind *:8074
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i11_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_0_be if { path_reg -i ^[/]+site-betlists/runningbetlist[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_1_be if { path_reg -i ^[/]+site-betlists/lastbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_2_be if { path_reg -i ^[/]+site-betlists/monitoringbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i11_mb_ALPHAPROD_be

frontend rome_i11_mb2_ALPHAPROD_fe
    bind *:8077
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i11_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_0_be if { path_reg -i ^[/]+site-betlists/runningbetlist[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_1_be if { path_reg -i ^[/]+site-betlists/lastbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_2_be if { path_reg -i ^[/]+site-betlists/monitoringbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i11_mb2_ALPHAPROD_be

# Report
backend rome_alpha_i11_reports_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_reports_ALPHAPROD_3_ 4 alpha_reports_ALPHAPROD_3:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

