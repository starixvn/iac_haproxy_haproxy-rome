    use_backend rome_alpha_i11_betlists_ALPHAPROD_1_be if { path_reg -i ^[/]+site-betlists/lastbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_2_be if { path_reg -i ^[/]+site-betlists/monitoringbets[/]? }
    use_backend rome_alpha_i11_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend rome_fanex_customer_cdn_ALPHAPROD_1_be if { path_reg ^[/]+stdcsv1[/]? }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-li88ag-com.map)] if { hdr(host) -i mb2.li88ag.com -i mb2.halo888.com -i mb2.123halo.com }
    default_backend default_backend_nodes

# Report
backend rome_alpha_i11_reports_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_reports_ALPHAPROD_3_ 4 alpha_reports_ALPHAPROD_3:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

