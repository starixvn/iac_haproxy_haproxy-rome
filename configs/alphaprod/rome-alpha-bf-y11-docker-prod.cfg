#### I11 FE
frontend rome_alpha_i11_bf_ALPHAPROD_fe
    bind *:860
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i11_internalreports_bf_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i11_internalbetlists_bf_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/ex11.726872.com.map)] if { hdr(host) -i ex11.726872.com ex11.focapts.com }
    use_backend rome_alphaplus_ibc_login_ALPHAPROD_be if { hdr(host) -i www.li88ag.com }
    default_backend rome_alpha_i11_bf_ALPHAPROD_be

# I11 BE
backend rome_alpha_i11_internal_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_8085 10.2.27.117:8085 check
    server 10.2.27.123_8085 10.2.27.123:8085 check

backend rome_alpha_i11_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.117_605 10.2.27.117:605 check
    server 10.2.27.123_605 10.2.27.123:605 check

## Report i11
backend rome_alpha_i11_internalreports_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_internalreports_ALPHAPROD_3_ 2 alpha_internalreports_ALPHAPROD_3:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

## Betlist i11
backend rome_alpha_i11_internalbetlists_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_internalbetlists_ALPHAPROD_3_ 2 alpha_internalbetlists_ALPHAPROD_3:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
