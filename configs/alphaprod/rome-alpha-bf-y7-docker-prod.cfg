#### I7 FE
frontend rome_alpha_i7_bf_ALPHAPROD_fe
    bind *:859
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i7_internalreports_bf_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i7_internalbetlists_bf_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/ex7.726872.com.map)] if { hdr(host) -i ex7.726872.com ex7.focapts.com }
    default_backend rome_alpha_i7_bf_ALPHAPROD_be

# I7 BE
backend rome_alpha_i7_internal_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_8083 10.2.27.111:8083 check
    server 10.2.27.112_8083 10.2.27.112:8083 check

backend rome_alpha_i7_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_602 10.2.27.111:602 check
    server 10.2.27.112_602 10.2.27.112:602 check

## Report i7
backend rome_alpha_i7_internalreports_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_internalreports_ALPHAPROD_2_ 2 alpha_internalreports_ALPHAPROD_2:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

## Betlist i7
backend rome_alpha_i7_internalbetlists_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_internalbetlists_ALPHAPROD_2_ 2 alpha_internalbetlists_ALPHAPROD_2:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
