frontend rome_alpha_assets_ALPHAPROD_fe
    bind *:822
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
default_backend rome_alpha_assets_ALPHAPROD_be

frontend rome_alpha_assets_ALPHAPROD_2_fe
    bind *:823
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
default_backend rome_alpha_assets_ALPHAPROD_2_be

frontend rome_alpha_assets_ALPHAPROD_3_fe
    bind *:821
    option forwardfor
    option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend rome_alpha_assets_ALPHAPROD_3_be

#### I1
backend rome_alpha_assets_ALPHAPROD_be
    option http-server-close
    option httpchk HEAD /bundles/common/hc.css
    http-check expect status 200
    server-template alpha_assets_ALPHAPROD_ 2 alpha_assets_ALPHAPROD:8080 check inter 12s fall 5 rise 5 resolvers docker init-addr none
