    use_backend rome_fanex_customer_cdn_ALPHAPROD_1_be if { path_reg ^[/]+stdcsv1[/]? }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-wi43ver-com.map)] if { hdr(host) -i mb.wi43ver.com }
