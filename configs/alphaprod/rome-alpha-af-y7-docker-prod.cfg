#### I7 
frontend rome_i7_mb_ALPHAPROD_fe
    bind *:8071
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i7_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i7_betlists_ALPHAPROD_0_be if { path_reg -i ^[/]+site-betlists/runningbetlist[/]? }
    use_backend rome_alpha_i7_betlists_ALPHAPROD_1_be if { path_reg -i ^[/]+site-betlists/lastbets[/]? }
    use_backend rome_alpha_i7_betlists_ALPHAPROD_2_be if { path_reg -i ^[/]+site-betlists/monitoringbets[/]? }
    use_backend rome_alpha_i7_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend rome_fanex_customer_cdn_ALPHAPROD_1_be if { path_reg ^[/]+stdcsv1[/]? }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-wi43ver-com.map)] if { hdr(host) -i mb.wi43ver.com }
    #use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-x311y-com.map)] if { hdr(host) -i mb.x311y.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-x311y-com.map)] if { hdr(host) -i mb.x311y.com -i mb.b88ag.com }
    default_backend rome_i7_mb_ALPHAPROD_be

