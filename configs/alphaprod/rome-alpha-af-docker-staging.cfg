#### I1 
frontend rome_i1_af_staging_ALPHAPROD_fe
    bind *:7011
    option forwardfor
    use_backend rome_alpha_i1_stagingreports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_stagingbetlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i1_mb_staging_ALPHAPROD_be

backend rome_alpha_i1_stagingreports_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,lower,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_stagingreports_ALPHAPROD_ 2 alpha_stagingreports_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

backend rome_alpha_i1_stagingbetlists_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,lower,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_stagingbetlists_ALPHAPROD_ 2 alpha_stagingbetlists_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none

