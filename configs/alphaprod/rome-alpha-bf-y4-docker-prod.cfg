# I4 BE
backend rome_alpha_i4_internal_bf_ALPHAPROD_be
    #balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server 10.2.27.111_8084 10.2.27.111:8084 check
    server 10.2.27.112_8084 10.2.27.112:8084 check

## Report i4
backend rome_alpha_i4_internalreports_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_internalreports_ALPHAPROD_4_ 2 alpha_internalreports_ALPHAPROD_4:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none

## Betlist i4
backend rome_alpha_i4_internalbetlists_bf_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_internalbetlists_ALPHAPROD_4_ 2 alpha_internalbetlists_ALPHAPROD_4:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
