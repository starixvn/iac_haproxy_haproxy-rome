#### I1 FE
frontend rome_i1_mb_ALPHAPROD_fe
    bind *:8072
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i1_mb_ALPHAPROD_be

frontend rome_i1_mb2_ALPHAPROD_fe
    bind *:8078
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i1_mb2_ALPHAPROD_be
## Report
backend rome_alpha_i1_reports_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-reports[/]?,/)]
    server-template alpha_reports_ALPHAPROD_ 4 alpha_reports_ALPHAPROD:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
## Betlist
backend rome_alpha_i1_betlists_ALPHAPROD_be
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^[/]+site-betlists[/]?,/)]
    server-template alpha_betlists_ALPHAPROD_ 2 alpha_betlists_ALPHAPROD:80 check inter 3s fall 5 rise 5 resolvers docker init-addr none
