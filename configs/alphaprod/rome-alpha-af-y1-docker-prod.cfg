### I1 FE
frontend rome_i1_mb_ALPHAPROD_fe
    bind *:8072
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_reports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_0_be if { path_reg -i ^[/]+site-betlists/runningbetlist[/]? }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_1_be if { path_reg -i ^[/]+site-betlists/lastbets[/]? }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_2_be if { path_reg -i ^[/]+site-betlists/monitoringbets[/]? }
    use_backend rome_alpha_i1_betlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    use_backend rome_fanex_customer_cdn_ALPHAPROD_1_be if { path_reg ^[/]+stdcsv1[/]? }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-mu88ag-com.map)] if { hdr(host) -i mb.mu88ag.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-ultra88-com.map)] if { hdr(host) -i mb.ultra88.com -i mb.logifun.com -i mb.stakecity.com -i mb.mefolk.com -i mb.bictown.com -i mb.trumpback.com -i mb.saki88.com -i mb.zuranic.com -i mb.bori88.com -i mb.ozerani.com -i mb.rubikta.com -i mb.borinote.com -i mb.consonate.com -i mb.riki88.com -i mb.zeta88.com -i mb.zata88.com -i mb.gatonic.com }
    default_backend default_backend_nodes

