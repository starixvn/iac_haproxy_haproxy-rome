#### I1
frontend rome_alpha_beforelogin_ALPHAPROD_fe
    bind *:802
    option dontlog-normal
    option forwardfor
    default_backend rome_alpha_beforelogin_ALPHAPROD_be

backend rome_alpha_beforelogin_ALPHAPROD_be
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    server-template alpha_beforelogin_ALPHAPROD_ 2 alpha_beforelogin_ALPHAPROD:80 check inter 12s fall 5 rise 5 resolvers docker init-addr none
