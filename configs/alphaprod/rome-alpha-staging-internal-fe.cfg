frontend rome_i1_staging_internal_ALPHAPROD_fe
    bind *:703
    #option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend rome_alpha_i1_staginginternalreports_ALPHAPROD_be if { path_reg ^[/]+site-reports/ }
    use_backend rome_alpha_i1_staginginternalbetlists_ALPHAPROD_be if { path_reg ^[/]+site-betlists/ }
    default_backend rome_i1_staging_internal_ALPHAPROD_be
 
