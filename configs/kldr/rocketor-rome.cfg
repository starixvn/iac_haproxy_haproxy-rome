

backend rome_deposit_api_gateways_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    server-template deposit_api_gateways_KLDR_ 2 deposit_api_gateways_KLDR:5000 check resolvers docker init-addr none

backend rome_nap_fanex_nap_home_KLDR_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/,/,i)]
    server-template nap_fanex_nap_home_KLDR_ 1 nap_fanex_nap_home_KLDR:5000 check resolvers docker init-addr none

